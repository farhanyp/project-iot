services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: watervend-mosquitto-broker
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data_local:/mosquitto/data
      - mosquitto_log_local:/mosquitto/log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - watervend-local-network
      - global-vps-network

  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: watervend-bridge
    restart: always
    environment:
      - NODE_ENV=production
      - WS_PORT=3002
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtt://mosquitto:1883}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/air_minum_db?schema=public}
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY}
      - MIDTRANS_MERCHANT_ID=${MIDTRANS_MERCHANT_ID}
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION:-false}
    ports:
      - "3002:3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mosquitto
    networks:
      - watervend-local-network
      - global-vps-network
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    container_name: watervend-web
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/air_minum_db?schema=public}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtt://mosquitto:1883}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY}
      - MIDTRANS_MERCHANT_ID=${MIDTRANS_MERCHANT_ID}
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION:-false}
      - AUTH_SECRET=${AUTH_SECRET:-watervend-super-secret-key-2026}
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - bridge
    networks:
      - watervend-local-network
      - global-vps-network
      - dokploy-network

volumes:
  mosquitto_data_local:
  mosquitto_log_local:

networks:
  watervend-local-network:
    driver: bridge
  global-vps-network:
    external: true
  dokploy-network:
    external: true
