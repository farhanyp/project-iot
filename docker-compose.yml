version: '3.8'

services:
  # 1. PostgreSQL Database
  global-postgres-db:
    image: postgres:16-alpine
    container_name: watervend-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-air_minum_db}
    ports:
      # Port 5433 di host agar tidak bentrok dengan PostgreSQL port 5432 lokal laptop
      - '${DB_PORT:-5433}:5432'
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    networks:
      - watervend-local-network

  # 2. Eclipse Mosquitto MQTT Broker (untuk komunikasi ESP32)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: watervend-mosquitto-broker
    restart: always
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data_local:/mosquitto/data
      - mosquitto_log_local:/mosquitto/log
    networks:
      - watervend-local-network

volumes:
  postgres_data_local:
  mosquitto_data_local:
  mosquitto_log_local:

networks:
  watervend-local-network:
    driver: bridge
